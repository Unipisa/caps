name: tests

on: push

jobs:
  docker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: JS tests
        run: |
          cd frontend/
          npm ci
          npm run test
          npm run deploy
          npm run deploy:dev
      - name: PHP tests
        run: |
          cd backend/
          sudo apt-get update
          sudo apt-get install php8.5
          php8.5 -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php8.5 composer-setup.php
          php8.5 -r "unlink('composer-setup.php');"
          sudo apt-get -y install php-mbstring php-intl php-xml php-sqlite3 php-mysql php-zip php-ldap php-gd
          php8.5 composer.phar -n install
          bin/cake migrations migrate
          php8.5 vendor/bin/phpunit --debug
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Docker meta
        id: meta
        uses: crazy-max/ghaction-docker-meta@v4
        with:
          images: harbor.cs.dm.unipi.it/caps/caps
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Login to Docker Registry
        uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
          registry: harbor.cs.dm.unipi.it
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Notify Omicron CI (develop)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        env:
          OMICRON_API_KEY: ${{ secrets.OMICRON_API_KEY_DEVELOP }}
        run: |
          curl -X POST "https://ci.omicron.dm.unipi.it/update?api_key=${OMICRON_API_KEY}" -fsS
      - name: Notify Omicron CI (Matematica)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          OMICRON_API_KEY: ${{ secrets.OMICRON_API_KEY_MATEMATICA }}
        run: |
          curl -X POST "https://ci.omicron.dm.unipi.it/update?api_key=${OMICRON_API_KEY}" -fsS
      - name: Notify Omicron CI (Fisica)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          OMICRON_API_KEY: ${{ secrets.OMICRON_API_KEY_FISICA }}
        run: |
          curl -X POST "https://ci.omicron.dm.unipi.it/update?api_key=${OMICRON_API_KEY}" -fsS
